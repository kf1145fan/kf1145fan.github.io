name = "blog-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
nodejs_compat = true

# 通过 Cloudflare dashboard / workflow 注入的环境变量（作为 secret 或 var）：
# GH_TOKEN                 GitHub Personal Access Token（有仓库读写权限，用于发布文章）
# GH_REPO                  形如 kf1145fan/kf1145fan.github.io
# GH_BRANCH                hexo 源分支，默认 main
# POSTS_DIR                hexo 文章目录，默认 source/_posts
# ADMIN_USER / ADMIN_PASS  管理后台账号密码
# PAGES_URL                GitHub Pages 站点地址，默认 https://kf1145fan.github.io
# WALINE_SERVER            Waline 服务端地址，默认 https://waline.wn5.top
# SITE_URL                 博客对外域名，默认 https://blog.902786.xyz

[vars]
ADMIN_USER = "admin"
ADMIN_PASS = "158899ab@"
GH_REPO = "kf1145fan/kf1145fan.github.io"
GH_BRANCH = "main"
POSTS_DIR = "source/_posts"
PAGES_URL = "https://kf1145fan.github.io"
WALINE_SERVER = "https://waline.wn5.top"
SITE_URL = "https://blog.902786.xyz"