name = "blog-worker"
main = "src/index.ts"
compatibility_date = "2026-06-03"
compatibility_flags = ["nodejs_compat"]
# 开启 workers.dev 子域名：任何人 fork 后都能先拿到一个可访问地址（绑定自定义域名后可继续用）
workers_dev = true

# ===================== 通常无需修改本文件 =====================
# 环境变量（作为 secret 或 var 注入）：
# GH_TOKEN                 GitHub PAT（仓库读写，用于发布/更新/删除博客文章）
# GH_REPO                  形如 owner/repo，部署时由工作流自动注入
# GH_BRANCH                hexo 源分支，默认 main
# POSTS_DIR                hexo 文章目录，默认 source/_posts
# PAGES_URL                GitHub Pages 地址，未配置时按 GH_REPO 推导
# SITE_URL                 博客对外域名，未配置时自动取当前请求域名
# JWT_SECRET               后台登录 JWT 密钥（不填则首次部署自动生成）
# SECURE_DOMAINS           评论 CORS 允许的域名，逗号分隔（默认放行）
#
# 以下变量无需手动配置：
# - GH_REPO   ：部署时由 GitHub Actions 自动注入（= 当前仓库 owner/repo）
# - PAGES_URL ：未配置时 Worker 按 GH_REPO 自动推导为 https://<owner>.github.io
# - SITE_URL  ：未配置时 Worker 自动取「当前请求的域名」（绑定域名后即生效，邮件链接也用它）
# - GH_BRANCH / POSTS_DIR：不填时用默认值 main / source/_posts
# 如需覆盖默认行为，取消下面注释并填写即可：
[vars]
# GH_REPO   = "owner/repo"
# GH_BRANCH = "main"
# POSTS_DIR = "source/_posts"
# PAGES_URL = "https://owner.github.io"
# SITE_URL  = "https://你的博客域名"

# Waline 评论数据存储：D1 数据库
# database_id 是占位符（全 0 UUID，保证本地 wrangler dev 能通过格式校验），
# 部署工作流会自动查询/创建 waline-db 并把这里替换成真实 id。
[[d1_databases]]
binding = "DB"
database_name = "waline-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# 自定义域名路由（如需绑定，取消注释并改成自己的域名）
# [[routes]]
# pattern = "your.domain.com"
# custom_domain = true