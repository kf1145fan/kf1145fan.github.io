name = "waline-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 数据库：评论数据存储
[[d1_databases]]
binding = "WALINE_DB"
database_name = "waline-db"
database_id = "5edf90b0-98f2-4258-a7ae-15db7e2ba0f6"

# 环境变量：Waline 服务配置
[vars]
# 站点域名（用于邮件通知链接等）
SITE_NAME = "我的博客"
SITE_URL = "https://blog.902786.xyz"
# 评论审核：true 需要审核后显示，false 直接显示
COMMENT_AUDIT = "false"
# 头像服务
AVATAR_FALLBACK = "mp"
# 禁用搜索（防滥用）
DISABLE_SEARCH = "false"
# 禁用用户自定义页面信息
DISABLE_USERAGENT = "false"
