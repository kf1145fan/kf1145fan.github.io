name: 完整部署：GH Pages + CF Worker

on:
  # 仅手动触发（初次完整部署：构建博客→推 gh-pages、部署 waline、部署 blog-worker）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ---- 0. 自动查询/创建 D1 数据库（任何人 fork 后都无需手填 id）----
  prepare-d1:
    runs-on: ubuntu-latest
    outputs:
      d1_id: ${{ steps.d1.outputs.id }}
    steps:
      - name: Ensure D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID_VAR: ${{ vars.D1_DATABASE_ID }}
        run: |
          set -e
          DB_NAME="blog-db"
          ID="${D1_DATABASE_ID_VAR:-}"
          if [ -n "$ID" ]; then echo "使用仓库变量 D1_DATABASE_ID=$ID"; fi
          if [ -z "$ID" ]; then
            API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
            fetch() { curl -s "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"; }
            RESP="$(fetch || true)"
            ID="$(printf '%s' "$RESP" | jq -r --arg n "$DB_NAME" '.result[]? | select(.name==$n) | .uuid' 2>/dev/null | head -1)"
            if [ -z "$ID" ] || [ "$ID" = "null" ]; then
              echo "未找到 D1 库 $DB_NAME，尝试创建..."
              curl -s -X POST "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" -d "{\"name\":\"$DB_NAME\"}" >/dev/null || true
              RESP="$(fetch || true)"
              ID="$(printf '%s' "$RESP" | jq -r --arg n "$DB_NAME" '.result[]? | select(.name==$n) | .uuid' 2>/dev/null | head -1)"
            fi
            if [ -z "$ID" ] || [ "$ID" = "null" ]; then
              echo "::error::无法自动获取 D1 id（响应：${RESP:0:200}）。请在 CF_API_TOKEN 勾选 D1:Edit，或设置仓库变量 D1_DATABASE_ID"
              exit 1
            fi
          fi
          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "D1 id -> $ID"

  # ---- 1. 构建 Hexo 并部署到 GitHub Pages（gh-pages 分支）----
  build-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Hexo deps
        run: npm install

      # 站点地址：优先用仓库 Variables 的 SITE_URL；否则按仓库推导 GitHub Pages 地址。
      # 这样 fork 后生成的页面/资源链接指向自己的地址，而不是上游域名。
      - name: Set site URL in _config.yml
        env:
          SITE_URL_VAR: ${{ vars.SITE_URL }}
        run: |
          OWNER="${{ github.repository_owner }}"
          NAME="${{ github.repository }}"; NAME="${NAME##*/}"
          if [ -n "$SITE_URL_VAR" ]; then
            URL="${SITE_URL_VAR%/}"; ROOT="/"
          elif [ "$(echo "$NAME" | tr 'A-Z' 'a-z')" = "$(echo "$OWNER" | tr 'A-Z' 'a-z').github.io" ]; then
            URL="https://$OWNER.github.io"; ROOT="/"
          else
            URL="https://$OWNER.github.io/$NAME"; ROOT="/$NAME/"
          fi
          sed -i "/^root: /d" _config.yml
          sed -i "s|^url: .*|url: $URL\nroot: $ROOT|" _config.yml
          echo "site url -> $URL  root -> $ROOT"

      - name: Generate site
        run: npx hexo generate

      - name: Enable Pages (from gh-pages branch)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          gh api -X POST repos/${REPO}/pages \
            -f "source[branch]=gh-pages" -f "source[path]=/" 2>/dev/null \
            || gh api -X PUT repos/${REPO}/pages \
               -f "source[branch]=gh-pages" -f "source[path]=/" 2>/dev/null \
            || echo "pages enable maybe already done (api may need manual)"

      - name: Deploy to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd public || exit 1
          git init -q
          git config user.name "deployer"
          git config user.email "deployer@users.noreply.github.com"
          git add -A
          git commit -m "deploy: $GITHUB_SHA" -q
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:gh-pages -q

  # ---- 2. 部署 Waline 评论服务到 Cloudflare Workers ----
  # 使用社区项目 Waline_On_Worker (https://github.com/lsy-404/Waline_On_Worker)
  deploy-waline:
    runs-on: ubuntu-latest
    needs: prepare-d1
    outputs:
      waline_url: ${{ steps.deploy.outputs.waline_url }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Clone Waline_On_Worker
        run: |
          git clone --depth 1 https://github.com/lsy-404/Waline_On_Worker.git waline-worker
          cd waline-worker
          echo "Cloned version: $(git rev-parse --short HEAD)"

      - name: Install deps
        working-directory: waline-worker
        run: pnpm install --frozen-lockfile

      - name: Generate wrangler.toml
        working-directory: waline-worker
        env:
          # D1 id 由 prepare-d1 任务自动查询/创建，fork 后无需手填
          D1_DB_ID: ${{ needs.prepare-d1.outputs.d1_id }}
          SITE_URL_VAR: ${{ vars.SITE_URL }}
        run: |
          # SECURE_DOMAINS：优先取仓库 Variables 的 SITE_URL 域名，否则用仓库的 GitHub Pages 域名
          DOMAIN="$(echo "$SITE_URL_VAR" | sed -E 's#^https?://##; s#/.*$##')"
          if [ -z "$DOMAIN" ]; then DOMAIN="${{ github.repository_owner }}.github.io"; fi
          cat > wrangler.toml << EOF
          name = "waline-worker"
          main = "src/index.ts"
          compatibility_date = "2026-06-03"

          [vars]
          SECURE_DOMAINS = "$DOMAIN"

          [[d1_databases]]
          binding = "DB"
          database_name = "blog-db"
          database_id = "$D1_DB_ID"
          EOF
          cat wrangler.toml

      - name: Generate JWT_SECRET
        id: jwt
        run: |
          # 使用 GitHub 仓库的 WALINE_JWT_SECRET secret，如果没有则随机生成
          if [ -n "${{ secrets.WALINE_JWT_SECRET }}" ]; then
            echo "jwt_secret=${{ secrets.WALINE_JWT_SECRET }}" >> $GITHUB_OUTPUT
          else
            SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
            echo "jwt_secret=$SECRET" >> $GITHUB_OUTPUT
            echo "Generated random JWT_SECRET (set WALINE_JWT_SECRET repo secret to persist across deploys)"
          fi

      - name: Initialize D1 schema
        working-directory: waline-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          pnpm run db:init 2>&1 || echo "Schema may already exist, continuing..."

      - name: Deploy Waline Worker
        id: deploy
        working-directory: waline-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          JWT_SECRET: ${{ steps.jwt.outputs.jwt_secret }}
        run: |
          # 设置 JWT_SECRET
          echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET 2>&1 || true
          
          # 部署
          pnpm run deploy 2>&1 | tee deploy.log
          
          # 提取部署后的 URL
          URL=$(grep -oE 'https?://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then
            # 备用：根据 worker 名称和账户信息构造
            URL="https://waline-worker.3168094652.workers.dev"
          fi
          echo "waline_url=$URL" >> $GITHUB_OUTPUT
          echo "Waline deployed at: $URL"

  # ---- 3. 部署 blog-worker 到 Cloudflare（整合 Waline 评论，挂载 /waline）----
  deploy-worker:
    runs-on: ubuntu-latest
    needs: [build-blog, deploy-waline, prepare-d1]
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install worker deps
        working-directory: blog-worker
        run: npm install

      - name: Fill D1 id into wrangler.toml
        working-directory: blog-worker
        run: |
          sed -i "s/00000000-0000-0000-0000-000000000000/${{ needs.prepare-d1.outputs.d1_id }}/g" wrangler.toml
          grep -m1 database_id wrangler.toml

      # D1 表结构由 blog-db 初始化；先尝试 apply，失败不阻断部署（若需手工初始化再处理）
      - name: Apply D1 migrations (create comment tables)
        working-directory: blog-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply blog-db --remote \
            || echo "D1 migration skipped (tables likely already exist; will verify at runtime)"

      - name: Deploy worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: blog-worker
          # GH_REPO 自动取当前仓库；PAGES_URL、SITE_URL 由 Worker 运行时自动推导，无需配置
          command: "deploy --var GH_REPO:${{ github.repository }}"
          secrets: |
            GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # JWT_SECRET：优先用仓库 secret；否则首次自动随机生成并保存在 Worker 上，
      # 之后每次部署保持不变（避免部署后登录态失效）
      - name: Ensure JWT_SECRET (首次自动随机生成，之后保持不变)
        working-directory: blog-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.JWT_SECRET }}" ]; then
            echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET
            echo "已使用仓库 secret 中的 JWT_SECRET"
          elif npx wrangler secret list 2>/dev/null | grep -q JWT_SECRET; then
            echo "JWT_SECRET 已存在，保持不变"
          else
            openssl rand -hex 32 | npx wrangler secret put JWT_SECRET
            echo "首次部署：已生成随机 JWT_SECRET 并保存到 Worker"
          fi