name: 临时诊断 GH_TOKEN

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe GH_TOKEN (仅输出状态码与权限范围，不输出令牌本身)
        env:
          T: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "GH_TOKEN is EMPTY"; exit 0; fi
          echo "length=${#T} prefix=${T:0:4}"
          echo "--- /user status ---"
          curl -s -o /dev/null -w "http=%{http_code}\n" -H "Authorization: Bearer $T" https://api.github.com/user
          echo "--- scopes ---"
          curl -sI -H "Authorization: Bearer $T" https://api.github.com/user | grep -i "x-oauth-scopes" || echo "(no scope header)"
          echo "--- repo write probe ---"
          curl -s -o /dev/null -w "repo_http=%{http_code}\n" -H "Authorization: Bearer $T" https://api.github.com/repos/${{ github.repository }}
          echo "--- actions write probe (dispatch dry: list workflows) ---"
          curl -s -o /dev/null -w "actions_http=%{http_code}\n" -H "Authorization: Bearer $T" https://api.github.com/repos/${{ github.repository }}/actions/workflows