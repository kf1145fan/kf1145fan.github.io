name: 仅更新 Cloudflare Worker

on:
  # 仅手动触发：只重新部署 blog-worker（不重新构建/推送博客）
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install worker deps
        working-directory: blog-worker
        run: npm install

      # D1 数据库：优先用仓库变量 D1_DATABASE_ID；没有则自动查询/创建同名库并回填 id。
      # 自动查询需要 CF_API_TOKEN 具备 D1:Edit 权限；若 Token 没这个权限，直接设置变量 D1_DATABASE_ID 即可。
      - name: Ensure D1 database (自动创建/查询并回填 database_id)
        working-directory: blog-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID_VAR: ${{ vars.D1_DATABASE_ID }}
        run: |
          set -e
          DB_NAME="blog-db"
          ID="${D1_DATABASE_ID_VAR:-}"
          if [ -n "$ID" ]; then echo "使用仓库变量 D1_DATABASE_ID=$ID"; fi
          if [ -z "$ID" ]; then
            API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
            fetch() { curl -s "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"; }
            RESP="$(fetch || true)"
            ID="$(printf '%s' "$RESP" | jq -r --arg n "$DB_NAME" '.result[]? | select(.name==$n) | .uuid' 2>/dev/null | head -1)"
            if [ -z "$ID" ] || [ "$ID" = "null" ]; then
              echo "未找到 D1 库 $DB_NAME，尝试创建..."
              curl -s -X POST "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" -d "{\"name\":\"$DB_NAME\"}" >/dev/null || true
              RESP="$(fetch || true)"
              ID="$(printf '%s' "$RESP" | jq -r --arg n "$DB_NAME" '.result[]? | select(.name==$n) | .uuid' 2>/dev/null | head -1)"
            fi
            if [ -z "$ID" ] || [ "$ID" = "null" ]; then
              echo "::error::无法自动获取 D1 id（响应：${RESP:0:200}）。请在 CF_API_TOKEN 勾选 D1:Edit，或设置仓库变量 D1_DATABASE_ID"
              exit 1
            fi
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/g" wrangler.toml
          echo "D1 database_id -> $ID"

      - name: Apply D1 migrations (create comment tables)
        working-directory: blog-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply blog-db --remote \
            || echo "D1 migration skipped (tables likely already exist; will verify at runtime)"

      - name: Deploy worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: blog-worker
          # GH_REPO 自动取当前仓库；PAGES_URL、SITE_URL 由 Worker 运行时自动推导，无需配置
          command: "deploy --var GH_REPO:${{ github.repository }}"
          secrets: |
            GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # JWT_SECRET：优先用仓库 secret；否则首次自动随机生成并保存在 Worker 上，
      # 之后每次部署保持不变（避免部署后登录态失效）
      - name: Ensure JWT_SECRET (首次自动随机生成，之后保持不变)
        working-directory: blog-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.JWT_SECRET }}" ]; then
            echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET
            echo "已使用仓库 secret 中的 JWT_SECRET"
          elif npx wrangler secret list 2>/dev/null | grep -q JWT_SECRET; then
            echo "JWT_SECRET 已存在，保持不变"
          else
            openssl rand -hex 32 | npx wrangler secret put JWT_SECRET
            echo "首次部署：已生成随机 JWT_SECRET 并保存到 Worker"
          fi
