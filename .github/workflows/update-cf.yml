name: 仅更新 Cloudflare Worker

on:
  # 仅手动触发：只重新部署 blog-worker（不重新构建/推送博客）
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install worker deps
        working-directory: blog-worker
        run: npm install

      - name: Ensure JWT_SECRET exists (persistent via repo secret, fallback fixed)
        id: jwt
        run: |
          if [ -n "${{ secrets.JWT_SECRET }}" ]; then
            echo "${{ secrets.JWT_SECRET }}" > .jwt_secret
          else
            echo "kfBlog_Waline_1w5zD9pQrT" > .jwt_secret
          fi
          echo "jwt_secret=$(cat .jwt_secret)" >> $GITHUB_OUTPUT

      - name: Apply D1 migrations (create comment tables)
        working-directory: blog-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply waline-db --remote \
            || echo "D1 migration skipped (tables likely already exist; will verify at runtime)"

      - name: Deploy worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: blog-worker
          command: deploy
          secrets: |
            GH_TOKEN
            JWT_SECRET
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          JWT_SECRET: ${{ steps.jwt.outputs.jwt_secret }}
